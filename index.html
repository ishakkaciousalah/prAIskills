<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.pricing{
    width:100%;
    max-width:300px;
    margin:auto;
    background-color:#fff;
    box-shadow:0 0 10px #ccc;
    padding:20px;
    border-radius:10px;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-size:18px;
    color:green;
    margin-bottom:15px;
}

.features{
    list-style:none;
    padding-left:0;
}

.features li{
    padding:8px;
    border-bottom:1px solid #eee;
}

.btn{
    background:blue;
    color:white;
    padding:10px 20px;
    border:none;
    margin-top:15px;
    width:100%;
    cursor:pointer;
    border-radius:5px;
}

.btn:hover{
    background:darkblue;
}

</style>
</head>
<body>

<div class="pricing">
    <h2 class="title">Basic Plan</h2>

    <p class="price">$9.99/month</p>

    <ul class="features">
        <li>1 GB Storage</li>
        <li>Basic Support</li>
        <li>All Core Features</li>
    </ul>

    <button class="btn">Start Trial</button>
</div>

</body>
</html>
